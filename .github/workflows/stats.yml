name: Update stats
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-stats
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nkunze2306/github-achievements-by-niounze@v9
        with:
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          components: stats,achievements,dashboard,road
          output-dir: .
          timezone: Europe/Berlin
          commit: 'true'
